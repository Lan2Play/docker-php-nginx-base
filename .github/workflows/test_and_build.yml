name: Test and Build

on:
  push:
    branches: 
      - main
    paths-ignore:
      - README.md
      - .github/workflows/dependabot.yml
  pull_request:
    branches: 
      - main
  repository_dispatch: # Allows action to be triggered via webhook
  workflow_dispatch: # Allows action to be run manually from the Actions tab


jobs:
  build-docker:
      if: ${{ github.ref_name == 'main' || github.base_ref == 'main'  }}
      runs-on: 'ubuntu-latest'
      steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login to DockerHub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build 8.3 Linux Image
        if: ${{ github.event_name == 'pull_request' && (github.ref_name == 'main' || github.base_ref == 'main') }}
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7
          tags: |
            lan2play/docker-php-nginx-base:latest
            lan2play/docker-php-nginx-base:php8.5
            lan2play/docker-php-nginx-base:v6
          build-args: |
            BUILDNODE=GitHub (Run Number: ${{ github.run_number }} Run ID: ${{ github.run_id }})
            BUILDID=${{ github.run_id }}
            BUILDNUMBER=${{ github.run_number }}
            SOURCE_COMMIT=${{ github.sha }}
          no-cache: true
          push: false      
      - name: Build and push 8.3 Linux Image
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.base_ref == 'main') }}
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7
          tags: |
            lan2play/docker-php-nginx-base:latest
            lan2play/docker-php-nginx-base:php8.5
            lan2play/docker-php-nginx-base:v6
          build-args: |
            BUILDNODE=GitHub (Run Number: ${{ github.run_number }} Run ID: ${{ github.run_id }})
            BUILDID=${{ github.run_id }}
            BUILDNUMBER=${{ github.run_number }}
            SOURCE_COMMIT=${{ github.sha }}
          no-cache: true
          push: true